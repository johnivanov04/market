[project]
name = "equity-research"
version = "0.1.0"
description = "Systematic U.S. equity research with point-in-time correctness as the first requirement."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pyright[nodejs]>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "N",   # naming
    "PT",  # pytest style
    "RUF", # ruff-specific
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
